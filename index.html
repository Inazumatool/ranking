<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ランキング</title>
<style>
  :root { --bg:#f2f4f9; --card:#fff; --ink:#1b1c20; --sub:#6b7080; --line:#dde1ea; --main:#1f5fd6; --ok:#1a7f37; --ng:#c62828; --warn:#b26a00; --me:#fdecea; --border:#1b1c20; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 0; padding: 16px; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; margin: 0; font-size: 15px; padding: 10px; background: #e4e8f1; color: var(--ink); }
  .tabs button.on { background: var(--main); color: #fff; font-weight: bold; }
  .steps { display: flex; gap: 6px; margin-bottom: 12px; }
  .steps div { flex: 1; text-align: center; font-size: 12px; padding: 6px 0; border-radius: 999px; background: #e4e8f1; color: var(--sub); }
  .steps div.on { background: var(--main); color: #fff; font-weight: bold; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.07); margin-bottom: 12px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; color: var(--sub); }
  input[type=text], select { width: 100%; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .secret { -webkit-text-security: disc; }
  .show { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .pick { display: block; border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; color: var(--sub); }
  .pick b { color: var(--main); }
  .pick input { display: none; }
  button { width: 100%; font-size: 17px; padding: 13px; border: 0; border-radius: 10px; background: var(--main); color: #fff; margin-top: 14px; }
  button.sub { background: #e4e8f1; color: var(--ink); }
  button:disabled { opacity: .5; }
  .note { font-size: 12px; color: var(--sub); margin-top: 8px; line-height: 1.5; }
  .msg { font-size: 14px; margin-top: 10px; line-height: 1.6; }
  .ok { color: var(--ok); } .ng { color: var(--ng); } .warn { color: var(--warn); }
  .who { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; }
  .who .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .who .nm { font-weight: bold; font-size: 16px; word-break: break-all; }
  .who .meta { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .who .st { font-size: 13px; margin-top: 6px; }
  .who.done { background: #f1faf3; border-color: #bfe3c8; }
  .who button { margin-top: 8px; font-size: 15px; padding: 10px; }
  .idbox { font-family: "Roboto Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 22px; letter-spacing: 2px; font-weight: bold; color: var(--ink); background: #f4f6fb; border-radius: 8px; padding: 6px 10px; margin: 6px 0 4px; display: block; width: fit-content; font-variant-numeric: slashed-zero; }
  .cands button.cand { display: block; text-align: left; background: #eef3fd; color: var(--ink); border: 1px solid #c9d8f5; margin-top: 8px; padding: 10px 12px; }
  .cands .cn { display: block; font-weight: bold; font-size: 15px; }
  .cands .cw { display: block; font-size: 12px; color: var(--sub); margin-top: 2px; }
  .fix { margin-top: 6px; } .fix summary { font-size: 12px; color: var(--main); cursor: pointer; }
  .fix input { margin-top: 6px; font-family: monospace; text-transform: uppercase; }
  .big { font-size: 40px; text-align: center; margin: 6px 0; }
  .exbox { margin: 4px 0 10px; }
  .exbox summary { font-size: 13px; color: var(--main); cursor: pointer; }
  .ex { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 4px; }
  .ex figure { margin: 0; flex: 0 0 auto; text-align: center; }
  .ex img { width: 96px; height: auto; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .ex figcaption { font-size: 11px; color: var(--sub); margin-top: 3px; }
  .hide { display: none !important; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .head select { width: auto; flex: 1; }
  .head { gap: 8px; }
  .meline { font-weight: bold; color: #c62828; font-size: 16px; margin-top: 8px; }
  .info { font-size: 12px; color: var(--sub); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
  th { font-size: 11px; color: var(--sub); font-weight: normal; text-align: right; padding: 4px 4px; border-bottom: 1px solid var(--line); }
  th:nth-child(2) { text-align: left; }
  td { padding: 7px 4px; border-bottom: 1px solid #eef0f5; text-align: right; font-variant-numeric: tabular-nums; }
  td.nm { text-align: left; word-break: break-all; }
  #vRows tr { cursor: pointer; }
  td.rk { color: var(--sub); width: 2.2em; }
  tr.me td { background: var(--me); font-weight: bold; }
  tr.ten td { border-bottom: 2px solid var(--border); }
  .plus { color: var(--ok); } .minus { color: var(--ng); }
  .q { background: #fff3b0; border-radius: 4px; }
  .legend { font-size: 11px; color: var(--sub); margin-top: 6px; }
  .chart img { width: 100%; height: auto; display: block; border-radius: 8px; }
  #vPred > div { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; border-bottom: 1px solid #eef0f5; }
  .sched { font-size: 13px; }
  #vSched > div { padding: 5px 0; gap: 8px; border-bottom: 1px solid #eef0f5; display: flex; justify-content: space-between; }
  .sched .done { color: #9aa0ad; }
  .sched .today { color: #c25b00; font-weight: bold; }
  h2 { font-size: 15px; margin: 0 0 6px; }
</style></head>
<body><div class="wrap">
  <h1 id="title">ランキング</h1>
  <div id="notice" class="card hide" style="background:#fff8e1"></div>

  <div id="passBox" class="card">
    <label for="pass" style="margin-top:0">合言葉</label>
    <input id="pass" type="text" class="secret" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label class="show"><input id="showPass" type="checkbox"> 合言葉を表示する</label>
    <button id="enter">入る</button>
    <div id="passMsg" class="msg"></div>
  </div>

  <div id="main" class="hide">
    <div class="tabs"><button id="tView" class="on">ランキングを見る</button><button id="tUp">スクショを上げる</button></div>

    <!-- 見る -->
    <div id="view">
      <div class="card">
        <div class="head"><select id="vSeasonSel"></select><select id="vDay"></select></div>
        <div id="vSeason" class="info"></div>
        <label for="vFocus">注目する人（赤で表示・グラフも赤線）</label>
        <select id="vFocus"></select>
        <div id="vMe" class="meline"></div>
        <div id="vInfo" class="info"></div>
        <table><thead><tr><th>順位</th><th>名前</th><th>合計</th><th>当日</th><th>前日</th><th>前々日</th></tr></thead><tbody id="vRows"></tbody></table>
        <div class="legend">名前を押すと、その人に注目します。太線＝10位のボーダー　赤＝注目する人　<span class="q">黄</span>＝夜の間に増えた分を、まだ前日・当日に振り分けていない</div>
      </div>
      <div class="card chart"><h2>ポイントの推移</h2>
        <div class="head" style="margin-bottom:8px"><select id="gRange">
          <option value="all">シーズン全体</option><option value="3">最近3日</option><option value="5">最近5日</option><option value="7">最近7日</option><option value="custom">日付を選ぶ</option>
        </select></div>
        <div id="gCustom" class="head hide" style="margin-bottom:8px"><select id="gFrom"></select><span>〜</span><select id="gTo"></select></div>
        <button id="gShow" class="sub">グラフを表示</button>
        <img id="vChart" alt="" class="hide"></div>
      <div class="card pred"><h2>最終日の予想（直線の目安）</h2><div id="vPred"></div></div>
      <div class="card sched"><h2>日程</h2><div id="vSched"></div></div>
      <button id="reload" class="sub">最新にする</button>
    </div>

    <!-- 上げる -->
    <div id="up" class="hide">
      <div class="steps"><div id="s1" class="on">1 ランキング</div><div id="s2">2 知らない名前</div><div id="s3">3 おわり</div></div>
      <div id="pageUp" class="card">
        <label for="me" style="margin-top:0">あなたの名前（任意・登録した人として残ります）</label>
        <input id="me" type="text" maxlength="20" autocomplete="off">
        <label>ランキングのスクショ</label>
        <details class="exbox" open><summary>撮り方の見本</summary>
          <div class="note">ランキング画面を下へスクロールしながら、<b id="exRange">1〜15位</b>が全部写るように<b id="exShots">5枚</b>撮ってください。一番下の自分の行は写っていて大丈夫です（読みません）。</div>

<script>
  const $ = id => document.getElementById(id);
  const MAX = 12;
  let PASS = '', WHO = '', LEFT = 0, FOCUS = '', DAY = '', SITE = {}, SDAYS = [], RANGE = 'all', CFROM = '', CTO = '', TIME_NOTE = '', CHART_ON = false;
  try { RANGE = localStorage.getItem('range') || 'all'; } catch (e) {}
  try { FOCUS = localStorage.getItem('focus') || ''; } catch (e) {}
  try { $('pass').value = localStorage.getItem('pass') || ''; $('me').value = localStorage.getItem('me') || ''; } catch (e) {}
  $('showPass').onchange = () => $('pass').classList.toggle('secret', !$('showPass').checked);

  // サーバー（Apps Script のウェブアプリ）。デプロイし直してURLが変わったら、ここを書き換える
  const API = 'https://script.google.com/macros/s/AKfycbyYmdi3hdkB61_6I-rB9oM39Aj6E4OCfpgh5uJEWtPWrjhpPkX1NyyhXYDoFAlzvwbTgQ/exec';
  async function call(fn, ...args) {
    let res;
    try {
      res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) });
    } catch (e) { throw new Error('つながりませんでした。電波のよい所でもう一度どうぞ'); }
    let j;
    try { j = await res.json(); } catch (e) { throw new Error('サーバーの返事が読めませんでした'); }
    if (j.err) throw new Error(j.err);
    return j.r;
  }
  function read(f) {
    return new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ng; r.readAsDataURL(f); });
  }
  function errText(e) { return (e && e.message) || String(e); }
  // 送る前に画像を軽くする：幅は最大900px、JPEG（画質0.8）に。文字の読み取りには十分で、大きさは数分の一になる
  // ===== 撮影時刻を決める：①ファイル名の日時 ②画像の中の撮影日時（Exif など） ③ファイルの日時 ④送った時刻 =====
  const hasNameTime = n => { let run = 0; for (const ch of String(n)) { if (ch >= '0' && ch <= '9') { if (++run >= 8) return true; } else run = 0; } return false; };
  function exifTime(buf) {
    // 画像の中の撮影日時を探す（JPEG の Exif、PNG の eXIf・テキスト）。見つからなければ 0
    try {
      const u8 = new Uint8Array(buf), dv = new DataView(buf);
      const tiff = off => {
        if (String.fromCharCode(u8[off], u8[off + 1], u8[off + 2], u8[off + 3]) === 'Exif') off += 6;   // 「Exif」の見出しが付いていることがある
        const bo = dv.getUint16(off);
        if (bo !== 0x4949 && bo !== 0x4D4D) return '';
        const le = bo === 0x4949;
        const g16 = o => dv.getUint16(off + o, le), g32 = o => dv.getUint32(off + o, le);
        const readIfd = (ifd, want) => {
          const n = g16(ifd), out = {};
          for (let i = 0; i < n; i++) {
            const e = ifd + 2 + i * 12, tag = g16(e);
            if (want.indexOf(tag) >= 0) out[tag] = { cnt: g32(e + 4), val: g32(e + 8) };
          }
          return out;
        };
        const str = (o, cnt) => { let t = ''; for (let i = 0; i < cnt - 1; i++) t += String.fromCharCode(u8[off + o + i]); return t; };
        const ifd0 = readIfd(g32(4), [0x0132, 0x8769]);
        let t = '';
        if (ifd0[0x8769]) { const ex = readIfd(ifd0[0x8769].val, [0x9003, 0x9004]); const e = ex[0x9003] || ex[0x9004]; if (e) t = str(e.val, e.cnt); }
        if (!t && ifd0[0x0132]) t = str(ifd0[0x0132].val, ifd0[0x0132].cnt);
        return t;
      };
      const parse = t => {   // "2026:11:21 20:38:51" など
        const d = String(t).split('-').join(':').split('T').join(' ').split(' ');
        const a = (d[0] || '').split(':').map(Number), b = (d[1] || '').split(':').map(Number);
        if (a.length < 3 || !a[0] || !a[1]) return 0;
        const ms = new Date(a[0], a[1] - 1, a[2], b[0] || 0, b[1] || 0, Math.floor(b[2] || 0)).getTime();
        return ms > 1500000000000 ? ms : 0;
      };
      if (u8[0] === 0xFF && u8[1] === 0xD8) {   // JPEG
        let o = 2;
        while (o + 4 < u8.length && u8[o] === 0xFF) {
          const mk = u8[o + 1], len = dv.getUint16(o + 2);
          if (mk === 0xE1 && String.fromCharCode(u8[o + 4], u8[o + 5], u8[o + 6], u8[o + 7]) === 'Exif') return parse(tiff(o + 10));
          if (mk === 0xDA) break;
          o += 2 + len;
        }
      } else if (u8[0] === 0x89 && u8[1] === 0x50) {   // PNG
        let o = 8;
        while (o + 8 < u8.length) {
          const len = dv.getUint32(o), type = String.fromCharCode(u8[o + 4], u8[o + 5], u8[o + 6], u8[o + 7]);
          if (type === 'eXIf') return parse(tiff(o + 8));
          if (type === 'tEXt' || type === 'iTXt') {
            let t = ''; for (let i = 0; i < Math.min(len, 4000); i++) t += String.fromCharCode(u8[o + 8 + i]);
            for (const key of ['DateTimeOriginal', 'CreateDate', 'Creation Time']) {
              const k = t.indexOf(key);
              if (k >= 0) { const m = parse(t.slice(k + key.length).split('').filter(c => c >= '0' && c <= '9' || c === ':' || c === '-' || c === ' ' || c === 'T').join('').trim().slice(0, 19)); if (m) return m; }
            }
          }
          if (type === 'IDAT' || type === 'IEND') break;
          o += 12 + len;
        }
      }
    } catch (e) {}
    return 0;
  }
  async function shotTime(f) {
    if (hasNameTime(f.name)) return { t: 0, src: 'name' };
    try { const m = exifTime(await f.arrayBuffer()); if (m) return { t: m, src: 'exif' }; } catch (e) {}
    // ファイルの日時が「今」に近すぎるときは、選んだときにコピーされた日時なので使わない
    if (f.lastModified && Date.now() - f.lastModified > 3 * 60000) return { t: f.lastModified, src: 'file' };
    return { t: Date.now(), src: 'upload' };
  }
  const SRC_TEXT = { name: '画像の名前', exif: '画像の中の撮影日時', file: 'ファイルの日時', upload: '送った時刻（撮影時刻が分からないため）' };

  async function shrink(f) {
    const tm = await shotTime(f);
    try {
      const url = URL.createObjectURL(f);
      const img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = url; });
      const k = Math.min(1, 900 / img.naturalWidth);
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const data = c.toDataURL('image/jpeg', 0.8).split(',')[1];
      return { name: String(f.name || 'image').replace(/[.][a-z0-9]+$/i, '') + '.jpg', type: 'image/jpeg', data: data, lastModified: f.lastModified, shotTime: tm.t, timeSource: tm.src };
    } catch (e) {
      return { name: f.name, type: f.type, data: await read(f), lastModified: f.lastModified, shotTime: tm.t, timeSource: tm.src };   // 変換できなければそのまま
    }
  }
  // いくつかずつ同時に送る
  async function pool(items, size, work) {
    const out = new Array(items.length); let next = 0;
    await Promise.all(Array.from({ length: Math.min(size, items.length) }, async () => {
      while (next < items.length) { const i = next++; out[i] = await work(items[i], i); }
    }));
    return out;
  }
  function say(el, text, cls) { el.textContent = text; el.className = 'msg ' + (cls || ''); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // ===== 合言葉 =====
  async function enter() {
    PASS = $('pass').value.trim();
    if (!PASS) return say($('passMsg'), '合言葉を入れてください', 'ng');
    $('enter').disabled = true;
    try {
      const r = await call('uploadCheckPassword', PASS);
      if (!r) return say($('passMsg'), '合言葉が違います', 'ng');
      SITE = r === true ? { canView: true, canUp: true } : r;
      try { localStorage.setItem('pass', PASS); } catch (e) {}
      if (SITE.title) { $('title').textContent = SITE.title; document.title = SITE.title; }
      if (SITE.notice) { $('notice').textContent = SITE.notice; $('notice').classList.remove('hide'); }
      if (!FOCUS && SITE.focus) FOCUS = SITE.focus;
      setPickText();
      $('tView').classList.toggle('hide', !SITE.canView); $('tUp').classList.toggle('hide', !SITE.canUp);
      $('passBox').classList.add('hide'); $('main').classList.remove('hide');
      if (SITE.canView) { tab('view'); loadView(''); }
      else if (SITE.canUp) tab('up');
      else { $('main').innerHTML = '<div class="card">今はお休み中です。</div>'; }
    } catch (e) { say($('passMsg'), '失敗しました：' + errText(e), 'ng'); }
    finally { $('enter').disabled = false; }
  }
  $('enter').onclick = enter;
  if ($('pass').value) enter();

  // ===== タブ =====
  function tab(which) {
    $('tView').classList.toggle('on', which === 'view'); $('tUp').classList.toggle('on', which === 'up');
    $('view').classList.toggle('hide', which !== 'view'); $('up').classList.toggle('hide', which !== 'up');
    window.scrollTo(0, 0);
  }
  $('tView').onclick = () => tab('view');
  $('tUp').onclick = () => tab('up');

  // ===== 見る =====
  function num(v, flag) {
    if (v === '' || v == null) return '<td></td>';
    const n = Number(v), cls = n > 0 ? 'plus' : n < 0 ? 'minus' : '';
    return '<td><span class="' + cls + (flag === 'Y' ? ' q' : '') + '">' + (n > 0 ? '+' : '') + esc(v) + '</span></td>';
  }
  async function loadView(day, season) {
    DAY = day;
    $('vSeason').textContent = '読み込み中…'; $('reload').disabled = true; $('vFocus').disabled = true;
    try {
      const d = await call('viewDashboard', PASS, day, FOCUS, season || '', {}, 'table'); // 表だけ先に（グラフはボタンで）
      if (d.seasons) $('vSeasonSel').innerHTML = d.seasons.map(x => '<option' + (x === (d.season || season) ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
      if (!d.ok) {
        $('vSeason').textContent = d.msg;
        ['vRows', 'vPred', 'vSched', 'vDay', 'vFocus'].forEach(id => $(id).innerHTML = '');
        $('vMe').textContent = ''; $('vInfo').textContent = ''; $('vChart').parentNode.classList.add('hide');
        return;
      }
      $('vSeason').textContent = ''; DAY_SHOWN = d.day;
      $('vDay').innerHTML = d.days.map(x => '<option' + (x === d.day ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
      $('vFocus').innerHTML = d.rows.map(r => '<option' + (r.name === d.meName ? ' selected' : '') + '>' + esc(r.name) + '</option>').join('');
      $('vMe').textContent = d.me || '';
      $('vInfo').textContent = d.info || '';
      $('vRows').innerHTML = d.rows.map(r => {
        const f = r.flag || '---';
        const cls = [r.name === d.meName ? 'me' : '', String(r.rank) === '10' ? 'ten' : ''].join(' ');
        return '<tr class="' + cls + '" data-name="' + esc(r.name) + '"><td class="rk">' + esc(r.rank) + '</td><td class="nm">' + esc(r.name) + '</td><td>' + esc(r.total) + '</td>'
          + num(r.d0, f[0]) + num(r.d1, f[1]) + num(r.d2, f[2]) + '</tr>';
      }).join('');
      SDAYS = d.seasonDays || [];
      $('gRange').value = RANGE;
      const opts = sel => SDAYS.map(x => '<option' + (x === sel ? ' selected' : '') + ' value="' + x + '">' + esc(x.slice(5)) + '</option>').join('');
      $('gFrom').innerHTML = opts(CFROM || SDAYS[0]); $('gTo').innerHTML = opts(CTO || d.day);
      $('gCustom').classList.toggle('hide', RANGE !== 'custom');
      $('vChart').parentNode.classList.remove('hide');
      if (CHART_ON) loadChart(); // 一度グラフを開いた人には、日や注目する人を変えたときもグラフを出す
      $('vPred').innerHTML = d.pred.map(p => '<div><span>' + esc(p.label) + '</span><span>' + esc(p.mid) + '（' + esc(p.low) + '〜' + esc(p.high) + '）</span></div>').join('');
      let today = false;
      $('vSched').innerHTML = d.schedule.map(s => {
        const cls = s.done ? 'done' : (!today ? (today = true, 'today') : '');
        return '<div class="' + cls + '"><span>' + esc(s.text) + '</span><span>' + (s.done ? '済' : cls === 'today' ? '今日' : '') + '</span></div>';
      }).join('');
    } catch (e) { $('vSeason').textContent = '読み込めませんでした：' + errText(e); }
    finally { $('reload').disabled = false; $('vFocus').disabled = false; }
  }
  function setFocus(name) {
    FOCUS = name; try { localStorage.setItem('focus', name); } catch (e) {}
    loadView(DAY_SHOWN || DAY);   // 今見ている日（シーズン）のまま、注目する人だけ変える
  }
  $('vFocus').onchange = () => setFocus($('vFocus').value);
  $('vRows').onclick = e => { const tr = e.target.closest('tr'); if (tr && tr.dataset.name) setFocus(tr.dataset.name); };
  $('vDay').onchange = () => loadView($('vDay').value);
  $('vSeasonSel').onchange = () => { CFROM = CTO = ''; loadView('', $('vSeasonSel').value); };
  // グラフの期間：シーズン全体／最近n日（表示中の日まで）／日付を選ぶ
  function graphRange(day) {
    if (RANGE === 'custom') return { from: CFROM, to: CTO };
    const n = Number(RANGE); const end = day || DAY_SHOWN;
    if (!n || !end) return {};
    const d = new Date(end.split('/').join('-') + 'T00:00:00'); d.setDate(d.getDate() - (n - 1));
    const z = x => ('0' + x).slice(-2);
    return { from: d.getFullYear() + '/' + z(d.getMonth() + 1) + '/' + z(d.getDate()), to: end };
  }
  let DAY_SHOWN = '';
  $('gRange').onchange = () => { RANGE = $('gRange').value; try { localStorage.setItem('range', RANGE); } catch (e) {}
    $('gCustom').classList.toggle('hide', RANGE !== 'custom');
    if (RANGE === 'custom') { CFROM = $('gFrom').value; CTO = $('gTo').value; }
    if (CHART_ON) loadChart(); };
  $('gFrom').onchange = $('gTo').onchange = () => { CFROM = $('gFrom').value; CTO = $('gTo').value; if (CHART_ON) loadChart(); };
  // グラフ：ボタンを押したときだけ作る（作るのに数秒かかるため）
  let CHART_SEQ = 0;
  async function loadChart() {
    const seq = ++CHART_SEQ, day = DAY_SHOWN;
    $('gShow').disabled = true; $('gShow').textContent = 'グラフを作っています…'; $('gShow').classList.remove('hide');
    try {
      const d = await call('viewDashboard', PASS, day, FOCUS, '', graphRange(day), 'chart');
      if (seq !== CHART_SEQ) return; // 途中で別のグラフを頼んだときは、古い方を捨てる
      CHART_ON = true;
      $('vChart').src = d.chart ? 'data:image/png;base64,' + d.chart : '';
      $('vChart').classList.toggle('hide', !d.chart);
      $('gShow').classList.add('hide');
    } catch (e) {
      if (seq !== CHART_SEQ) return;
      $('gShow').textContent = 'グラフを作れませんでした（もう一度押す）';
    } finally { if (seq === CHART_SEQ) $('gShow').disabled = false; }
  }
  $('gShow').onclick = loadChart;
  $('reload').onclick = () => loadView('');

  // ===== 上げる =====
  function step(n) { [1, 2, 3].forEach(i => $('s' + i).className = i === n ? 'on' : ''); }
  function show(id) { ['pageUp', 'pageWho', 'pageEnd'].forEach(p => $(p).classList.toggle('hide', p !== id)); window.scrollTo(0, 0); }
  function setPickText() {
    const rk = SITE.rankTo || 15, sh = SITE.shots || 5;
    $('exRange').textContent = '1〜' + rk + '位'; $('exShots').textContent = sh + '枚';
    $('picked').textContent = '1〜' + rk + '位が写った画像（' + sh + '枚）';
  }
  setPickText();
  $('files').onchange = () => { const n = ($('files').files || []).length; if (n) $('picked').textContent = n + '枚 選びました'; else setPickText(); };

  $('go').onclick = async () => {
    const files = Array.from($('files').files || []);
    WHO = $('me').value.trim();
    if (!files.length) return say($('upMsg'), '画像を選んでください', 'ng');
    if (files.length > MAX) return say($('upMsg'), '一度に送れるのは' + MAX + '枚までです', 'ng');
    $('go').disabled = true;
    try {
      try { localStorage.setItem('me', WHO); } catch (e) {}
      say($('upMsg'), '画像を準備中…');
      const packed = await pool(files, 3, f => shrink(f));
      say($('upMsg'), '送信中…（' + files.length + '枚）');
      const results = await call('uploadShots', PASS, packed, WHO);
      const names = results.map(r => r.name), ids = results.map(r => r.id).filter(Boolean);
      const srcs = Array.from(new Set(packed.map(p => p.timeSource || 'name')));
      TIME_NOTE = '撮影時刻は「' + srcs.map(x => SRC_TEXT[x] || x).join('・') + '」から決めました。';
      say($('upMsg'), '読み取り中…（30秒ほどかかります）');
      const r = await call('uploadProcess', PASS, ids, names);
      if (!r.ok) return end('画像は受け取りました。<br>' + esc(r.msg));
      if (!r.count) return end('画像は受け取りました。<br>ランキングの行が読み取れませんでした（ランキング画面の画像か確認してください）。');
      if (r.timing) TIME_NOTE += '　かかった時間：画像の読み取り ' + r.timing.read + '秒・シートの更新 ' + r.timing.sheet + '秒・名前の確認 ' + r.timing.names + '秒' + (r.timing.wait > 1 ? '・順番待ち ' + r.timing.wait + '秒' : '');
      if (!r.unknown.length) return end(r.count + '人ぶん読み取りました。<br>知らない名前はありませんでした。おわりです！');
      showWho(r.unknown, r.count);
    } catch (e) {
      say($('upMsg'), '失敗しました：' + errText(e), 'ng');
    } finally { $('go').disabled = false; }
  };

  function showWho(list, count) {
    step(2); show('pageWho'); LEFT = list.length; $('allDone').classList.add('hide');
    $('whoHead').innerHTML = count + '人ぶん読み取りました。<br><b>IDの分からない名前が' + list.length + '人</b>います。<br>候補に合う人がいれば押してください。いなければ、ゲームのランキングでその人をタップしてプロフィールを開き、<b>ユーザーIDが写った画面</b>のスクショを上げてください。';
    const box = $('whoList'); box.innerHTML = '';
    list.forEach(u => {
      const d = document.createElement('div'); d.className = 'who';
      const cands = u.cands || [];
      d.innerHTML = '<div class="top"><span class="nm"></span><span class="meta"></span></div>'
        + '<div class="st">' + (cands.length ? 'この人かも？　合っていれば押してください' : 'プロフィール画像を待っています') + '</div>'
        + '<div class="cands"></div>'
        + '<div class="note" style="margin-top:8px">' + (cands.length ? '候補にいない（新しい人）ときは、プロフィール画像で登録：' : '') + '</div>'
        + '<label class="pick" style="margin-top:4px;padding:12px"><input type="file" accept="image/*"><b>プロフィール画像を選ぶ</b></label>';
      d.querySelector('.nm').textContent = u.name;
      d.querySelector('.meta').textContent = u.rank + '位・' + u.points + (u.team ? '・' + u.team : '');
      const st = d.querySelector('.st'), inp = d.querySelector('input');
      const cbox = d.querySelector('.cands');
      cands.forEach(c => {
        const b = document.createElement('button'); b.className = 'cand';
        b.innerHTML = '<span class="cn"></span><span class="cw"></span>';
        b.querySelector('.cn').textContent = c.name + (c.team ? '（' + c.team + '）' : '');
        b.querySelector('.cw').textContent = c.why;
        b.onclick = async () => {
          if (!confirm('「' + u.name + '」は「' + c.name + '」で合っていますか？')) return;
          cbox.querySelectorAll('button').forEach(x => x.disabled = true);
          try {
            const r = await call('uploadSetId', PASS, { name: u.name, team: u.team }, '', c.id, WHO, 'pick');
            if (r.ok) { cbox.remove(); const n = d.querySelector('.note'); if (n) n.remove(); done(d, st, u, r); }
            else { st.textContent = r.msg; st.className = 'st ng'; cbox.querySelectorAll('button').forEach(x => x.disabled = false); }
          } catch (e) { st.textContent = '失敗：' + errText(e); st.className = 'st ng'; cbox.querySelectorAll('button').forEach(x => x.disabled = false); }
        };
        cbox.appendChild(b);
      });
      inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) sendProfile(d, st, u, f, false); inp.value = ''; };
      box.appendChild(d);
    });
  }

  async function sendProfile(d, st, u, f, force) {
    st.textContent = '読み取り中…'; st.className = 'st';
    d.querySelectorAll('button, .fix').forEach(x => x.remove());
    try {
      const r = await call('uploadProfile', PASS, await shrink(f), { name: u.name, team: u.team }, WHO, force);
      if (r.ok) done(d, st, u, r);
      else if (r.mismatch) {
        st.textContent = r.msg; st.className = 'st warn';
        const b = document.createElement('button'); b.textContent = 'この人で合っている（登録する）';
        b.onclick = () => sendProfile(d, st, u, f, true); d.appendChild(b);
      } else { st.textContent = r.msg; st.className = 'st ng'; idForm(d, st, u, '', '読み取れないときは、IDを手で入れて登録'); }
    } catch (e) { st.textContent = '失敗：' + errText(e); st.className = 'st ng'; }
  }
  // 登録できたら、読んだIDを大きく見せて確かめてもらう（違っていたら直せる）
  function done(d, st, u, r) {
    const first = !d.classList.contains('done');
    st.innerHTML = '✓ ' + esc(r.msg) + '<div class="idbox">' + esc(r.id) + '</div><span class="note">ゲームの画面のIDと同じか確かめてください（英字のOは使われないので、丸い文字は数字の0です）</span>';
    st.className = 'st ok';
    d.classList.add('done'); const p = d.querySelector('.pick'); if (p) p.remove();
    d.querySelectorAll('.fix, .cands, .note:not(.st .note)').forEach(x => x.remove());
    idForm(d, st, u, r.id, 'IDが違うときは直す');
    if (first && --LEFT <= 0) $('allDone').classList.remove('hide');
  }
  function idForm(d, st, u, fromId, label) {
    const box = document.createElement('details'); box.className = 'fix';
    box.innerHTML = '<summary></summary><input type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="例：3FZ5R0F47M"><button class="sub">このIDにする</button>';
    box.querySelector('summary').textContent = label;
    const inp = box.querySelector('input'), b = box.querySelector('button');
    if (!fromId) box.open = true;
    b.onclick = async () => {
      b.disabled = true;
      try {
        const r = await call('uploadSetId', PASS, { name: u.name, team: u.team }, fromId, inp.value, WHO);
        if (r.ok) done(d, st, u, r); else { st.textContent = r.msg; st.className = 'st ng'; }
      } catch (e) { st.textContent = '失敗：' + errText(e); st.className = 'st ng'; }
      finally { b.disabled = false; }
    };
    d.appendChild(box);
  }

  function end(html) { step(3); show('pageEnd'); $('endMsg').innerHTML = html + (TIME_NOTE ? '<div class="note" style="margin-top:10px">' + esc(TIME_NOTE) + '</div>' : ''); }
  $('finish').onclick = () => end(LEFT > 0 ? '残りの' + LEFT + '人は、あとで管理者が登録します。ありがとう！' : '知らない名前を全部登録しました。ありがとう！');
  $('again').onclick = () => { step(1); show('pageUp'); $('files').value = ''; setPickText(); say($('upMsg'), ''); };
  $('toView').onclick = () => { tab('view'); loadView(''); $('again').onclick(); };
</script>
</body></html>
